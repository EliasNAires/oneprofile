p</text><text fill="#000000" font-family="Verdana" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="163.8398" x="584.4346" y="730.6357">[por cada linea, mientras la lee]</text><g class="message" data-entity-1="part5" data-entity-2="part4" id="msg11"><polygon fill="#000000" points="634.46,752.2153,624.46,756.2153,634.46,760.2153,630.46,756.2153" style="stroke:#000000;stroke-width:1;"/><line style="stroke:#000000;stroke-width:1;" x1="628.46" x2="852.4307" y1="756.2153" y2="756.2153"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="70.0718" x="640.46" y="751.4604">callback(url)</text></g><g class="message" data-entity-1="part4" data-entity-2="part6" id="msg12"><polygon fill="#000000" points="1037.8853,781.1641,1047.8853,785.1641,1037.8853,789.1641,1041.8853,785.1641" style="stroke:#000000;stroke-width:1;"/><line style="stroke:#000000;stroke-width:1;" x1="623.46" x2="1043.8853" y1="785.1641" y2="785.1641"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="77.2827" x="630.46" y="780.4092">slugFrom(url)</text></g><g class="message" data-entity-1="part6" data-entity-2="part4" id="msg13"><polygon fill="#000000" points="634.46,810.1128,624.46,814.1128,634.46,818.1128,630.46,814.1128" style="stroke:#000000;stroke-width:1;"/><line style="stroke:#000000;stroke-width:1;stroke-dasharray:2,2;" x1="628.46" x2="1048.8853" y1="814.1128" y2="814.1128"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="136.3984" x="640.46" y="809.3579">"mercadolibre"  o  vacio</text></g><path d="M507,827.1128 L507,866.1128 L728,866.1128 L728,837.1128 L718,827.1128 L507,827.1128" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M718,827.1128 L718,837.1128 L728,837.1128 L718,827.1128" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="174.1733" x