<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="529px" preserveAspectRatio="none" style="width:648px;height:529px;background:#FFFFFF;" version="1.1" viewBox="0 0 648 529" width="648px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="Verdana" font-size="22" font-weight="bold" lengthAdjust="spacing" textLength="436" x="104.5" y="35.6357">Como se normaliza el titulo de una vacante</text><text fill="#000000" font-family="Verdana" font-size="22" font-weight="bold" lengthAdjust="spacing" textLength="273" x="186" y="60.9336">Un ejemplo, paso por paso</text><ellipse cx="143" cy="86.5957" fill="#FFFFFF" rx="10" ry="10" style="stroke:#000000;stroke-width:1.0;"/><path d="M274,113.5464 L274,129.4951 L254,133.4951 L274,137.4951 L274,153.4438 A0,0 0 0 0 274,153.4438 L641,153.4438 A0,0 0 0 0 641,153.4438 L641,123.5464 L631,113.5464 L274,113.5464 A0,0 0 0 0 274,113.5464 " fill="#FFFFFF" style="stroke:#000000;stroke-width:1.0;"/><path d="M631,113.5464 L631,123.5464 L641,123.5464 L631,113.5464 " fill="#FFFFFF" style="stroke:#000000;stroke-width:1.0;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="346" x="280" y="130.7402">title    = "Sr. Software Engineer - Backend (Remote) (m/f/d)"</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="146" x="280" y="145.689">location = "Remote - US"</text><rect fill="#FFFFFF" height="33.7988" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1.0;" width="222" x="32" y="116.5957"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="202" x="42" y="137.8516">llega una vacante de la tabla vacancy</text><path d="M300,169.2446 L300,200.1421 L280,204.1421 L300,208.1421 L300,239.0396 A0,0 0 0 0 300,239.0396 L633,239.0396 A0,0 0 0 0 633,239.0396 L633,179.2446 L623,169.2446 L300,169.2446 A0,0 0 0 0 300,169.2446 " fill="#FFFFFF" style="stroke:#000000;stroke-width:1.0;"/><path d="M623,169.2446 L623,179.2446 L633,179.2446 L623,169.2446 " fill="#FFFFFF" style="stroke:#000000;stroke-width:1.0;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="223" x="306" y="186.4385">"sr software engineer backend remote"</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="4" x="306" y="201.3872">&#160;</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="295" x="306" y="216.3359">Se van el punto, la raya, los parentesis y el (m/f/d).</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="312" x="306" y="231.2847">El punto de ".net" o el # de "c#" se hubieran quedado.</text><rect fill="#FFFFFF" height="61.3965" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1.0;" width="274" x="6" y="173.4438"/><text fill="#000000" font-family="Verdana" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="131" x="16" y="194.6997">TitleCleaner.clean(title)</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="216" x="16" y="208.4985">minusculas, sin acentos, sin simbolos,</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="254" x="16" y="222.2974">sin marca de genero, sin sigla repetida al final</text><path d="M299,249.0396 L299,294.8857 L279,298.8857 L299,302.8857 L299,348.7319 A0,0 0 0 0 299,348.7319 L629,348.7319 A0,0 0 0 0 629,348.7319 L629,259.0396 L619,249.0396 L299,249.0396 A0,0 0 0 0 299,249.0396 " fill="#FFFFFF" style="stroke:#000000;stroke-width:1.0;"/><path d="M619,249.0396 L619,259.0396 L629,259.0396 L619,249.0396 " fill="#FFFFFF" style="stroke:#000000;stroke-width:1.0;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="235" x="305" y="266.2334">titulo    = "sr software engineer backend"</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="130" x="305" y="281.1821">modalidad = REMOTE</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="4" x="305" y="296.1309">&#160;</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="301" x="305" y="311.0796">Manda la location: ahi lo dicen 14.624 de las 16.444</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="309" x="305" y="326.0283">remotas. No es FULLY_REMOTE porque despues de</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="198" x="305" y="340.9771">"Remote" le queda un lugar: "US".</text><rect fill="#FFFFFF" height="47.5977" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1.0;" width="272" x="7" y="275.0869"/><text fill="#000000" font-family="Verdana" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="252" x="17" y="296.3428">WorkModeExtractor.extract(limpio, location)</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="192" x="17" y="310.1416">lee la modalidad y la saca del titulo</text><path d="M264.5,372.582 L264.5,388.5308 L244.5,392.5308 L264.5,396.5308 L264.5,412.4795 A0,0 0 0 0 264.5,412.4795 L505.5,412.4795 A0,0 0 0 0 505.5,412.4795 L505.5,382.582 L495.5,372.582 L264.5,372.582 A0,0 0 0 0 264.5,372.582 " fill="#FFFFFF" style="stroke:#000000;stroke-width:1.0;"/><path d="M495.5,372.582 L495.5,382.582 L505.5,382.582 L495.5,372.582 " fill="#FFFFFF" style="stroke:#000000;stroke-width:1.0;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="220" x="270.5" y="389.7759">titulo    = "software engineer backend"</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="114" x="270.5" y="404.7246">seniority = SENIOR</text><rect fill="#FFFFFF" height="47.5977" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1.0;" width="203" x="41.5" y="368.7319"/><text fill="#000000" font-family="Verdana" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="183" x="51.5" y="389.9878">SeniorityExtractor.extract(titulo)</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="158" x="51.5" y="403.7866">lee el nivel y lo saca del titulo</text><path d="M266.5,426.3296 L266.5,449.7527 L246.5,453.7527 L266.5,457.7527 L266.5,481.1758 A0,0 0 0 0 266.5,481.1758 L504.5,481.1758 A0,0 0 0 0 504.5,481.1758 L504.5,436.3296 L494.5,426.3296 L266.5,426.3296 A0,0 0 0 0 266.5,426.3296 " fill="#FFFFFF" style="stroke:#000000;stroke-width:1.0;"/><path d="M494.5,426.3296 L494.5,436.3296 L504.5,436.3296 L494.5,426.3296 " fill="#FFFFFF" style="stroke:#000000;stroke-width:1.0;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="217" x="272.5" y="443.5234">title     = "software engineer backend"</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="114" x="272.5" y="458.4722">seniority = SENIOR</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="137" x="272.5" y="473.4209">work_mode = REMOTE</text><rect fill="#FFFFFF" height="33.7988" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1.0;" width="207" x="39.5" y="436.8533"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="187" x="49.5" y="458.1091">se guarda en normalized_vacancy</text><ellipse cx="143" cy="512.1758" fill="none" rx="11" ry="11" style="stroke:#000000;stroke-width:1.0;"/><ellipse cx="143" cy="512.1758" fill="#FFFFFF" rx="6" ry="6" style="stroke:#000000;stroke-width:1.0;"/><line style="stroke:#000000;stroke-width:1.0;" x1="143" x2="143" y1="96.5957" y2="116.5957"/><poly