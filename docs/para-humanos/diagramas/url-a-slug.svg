cing" textLength="224" x="424.25" y="183.5845">https://boards.greenhouse.io/robots.txt</text><rect fill="#FFFFFF" height="33.7988" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1.0;" width="155" x="243.25" y="132.0681"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="135" x="253.25" y="153.324">llega una URL del indice</text><path d="M372.75,258.4551 L372.75,281.8782 L352.75,285.8782 L372.75,289.8782 L372.75,313.3013 A0,0 0 0 0 372.75,313.3013 L593.75,313.3013 A0,0 0 0 0 593.75,313.3013 L593.75,268.4551 L583.75,258.4551 L372.75,258.4551 A0,0 0 0 0 372.75,258.4551 " fill="#FFFFFF" style="stroke:#000000;stroke-width:1.0;"/><path d="M583.75,258.4551 L583.75,268.4551 L593.75,268.4551 L583.75,258.4551 " fill="#FFFFFF" style="stroke:#000000;stroke-width:1.0;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="135" x="378.75" y="275.6489">Solo https, a proposito.</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="191" x="378.75" y="290.5977">Se midio: de las 76.765 capturas</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="200" x="378.75" y="305.5464">de un indice, las 76.765 son https.</text><rect fill="#FFFFFF" height="33.7988" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1.0;" width="64" x="288.75" y="268.9788"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="44" x="298.75" y="290.2346">sin slug</text><ellipse cx="320.75" cy="344.3013" fill="none" rx="11" ry="11" style="stroke:#000000;stroke-width:1.0;"/><ellipse cx="320.75" cy="344.3013" fill="#FFFFFF" rx="6" ry="6" style="stroke:#000000;stroke-width:1.0;"/><polygon fill="#FFFFFF" points="230.25,211.3394,411.25,211.3394,423.25,223.9883,411.25,236.6372,230.25,236.6372,218.25,223.9883,230.25,211.3394" style="stroke:#000000;stroke-width:1.0;"/><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="12" x="324.75" y="246.9551">no</text><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="121" x="230.25" y="221.6572">empieza con https:// y es</text><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="181" x="230.25" y="234.3062">un dominio de board de Greenhouse?</text><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="8" x="423.25" y="221.6572">si</text><rect fill="#FFFFFF" height="33.7988" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1.0;" width="233" x="204.25" y="397.3013"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="213" x="214.25" y="418.5571">cortar todo lo que venga despues del #</text><rect fill="#FFFFFF" height="33.7988" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1.0;" width="214" x="213.75" y="451.1001"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="194" x="223.75" y="472.356">separar el camino de la query (el ?)</text><rect fill="#FFFFFF" height="33.7988" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1.0;" width="247" x="197.25" y="504.8989"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="227" x="207.25" y="526.1548">quedarse con el primer tramo del camino</text><polygon fill="#FFFFFF" points="264.75,558.6978,376.75,558.6978,388.75,570.6978,376.75,582.6978,264.75,582.6978,252.75,570.6978,264.75,558.6978" style="stroke:#000000;stroke-width:1.0;"/><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="112" x="264.75" y="574.6912">ese tramo es "embed"?</text><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="8" x="244.75" y="568.3667">si</text><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="12" x="388.75" y="568.3667">no</text><path d="M224,592.6978 L224,623.5952 L204,627.5952 L224,631.5952 L224,662.4927 A0,0 0 0 0 224,662.4927 L449,662.4927 A0,0 0 0 0 449,662.4927 L449,602.6978 L439,592.6978 L224,592.6978 A0,0 0 0 0 224,592.6978 " fill="#FFFFFF" style="stroke:#000000;stroke-width:1.0;"/><path d="M439,592.6978 L439,602.6978 L449,602.6978 L439,592.6978 " fill="#FFFFFF" style="stroke:#000000;stroke-width:1.0;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="184" x="230" y="609.8916">Es el board metido como iframe</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="179" x="230" y="624.8403">dentro de la pagina de carreras</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="196" x="230" y="639.7891">de la empresa. Son un monton de</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="204" x="230" y="654.7378">capturas y apuntan al mismo lugar.</text><rect fill="#FFFFFF" height="33.7988" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1.0;" width="198" x="6" y="610.6958"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="178" x="16" y="631.9517">el slug esta en el parametro for=</text><rect fill="#FFFFFF" height="33.7988" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1.0;" width="135" x="469" y="592.6978"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="115" x="479" y="613.9536">ese tramo ES el slug</text><polygon fill="#FFFFFF" points="320.75,668.4927,332.75,680.4927,320.75,692.4927,308.75,680.4927,320.75,668.4927" style="stroke:#000000;stroke-width:1.0;"/><path d="M372.75,759.6084 L372.75,797.9802 L352.75,801.9802 L372.75,805.9802 L372.75,844.3521 A0,0 0 0 0 372.75,844.3521 L638.75,844.3521 A0,0 0 0 0 638.75,844.3521 L638.75,769.6084 L628.75,759.6084 L372.75,759.6084 A0,0 0 0 0 372.75,759.6084 " fill="#FFFFFF" style="stroke:#000000;stroke-width:1.0;"/><path d="M628.75,759.6084 L628.75,769.6084 L638.75,769.6084 L628.75,759.6084 " fill="#FFFFFF" style="stroke:#000000;stroke-width:1.0;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="187" x="378.75" y="776.8022">Este filtro, el solito, hace todo el</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="245" x="378.75" y="791.751">trabajo sucio sin listas negras: descarta lo</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="209" x="378.75" y="806.6997">vacio (el dominio pelado) y cualquier</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="199" x="378.75" y="821.6484">cosa con punto, como robots.txt o</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="220" x="378.75" y="836.5972">favicon.ico. Un slug nunca lleva punto.</text><rect fill="#FFFFFF" height="33.7988" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1.0;" width="64" x="288.75" y="785.0808"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="44" x="298.75" y="806.3367">sin slug</text><ellipse cx="320.75" cy="875.3521" fill="none" rx="11" ry="11" style="stroke:#000000;stroke-width:1.0;"/><ellipse cx="320.75" cy="875.3521" fill="#FFFFFF" rx="6" ry="6" style="stroke:#000000;stroke-width:1.0;"/><polygon fill="#FFFFFF" points="244.25,712.4927,397.25,712.4927,409.25,725.1416,397.25,737.7905,244.25,737.7905,232.25,725.1416,244.25,712.4927" style="stroke:#000000;stroke-width:1.0;"/><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="12" x="324.75" y="748.1084">no</text><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="139" x="244.25" y="722.8105">lo que quedo son solo letras,</text><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="153" x="244.25" y="735.4595">numeros, guiones o guion bajo?</text><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="8" x="409.25" y="722.8105">si</text><path d="M393.25,918.3521 L393.25,941.7751 L373.25,945.7751 L393.25,949.7751 L393.25,973.1982 A0,0 0 0 0 393.25,973.1982 L605.25,973.1982 A0,0 0 0 0 605.25,973.1982 L605.25,928.3521 L595.25,918.3521 L393.25,918.3521 A0,0 0 0 0 393.25,918.3521 " fill="#FFFFFF" style="stroke:#000000;stroke-width:1.0;"/><path d="M595.25,918.3521 L595.25,928.3521 L605.25,928.3521 L595.25,918.3521 " fill="#FFFFFF" style="stroke:#000000;stroke-width:1.0;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="191" x="399.25" y="935.5459">De las 76.765 capturas, solo 229</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="188" x="399.25" y="950.4946">no dan slug. Y son exactamente</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="122" x="399.25" y="965.4434">las que hay que tirar.</text><rect fill="#FFFFFF" height="33.7988" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1.0;" width="105" x="268.25" y="928.8757"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="85" x="278.25" y="950.1316">devolver el slug</text><ellipse cx="320.75" cy="1004.1982" fill="none" rx="11" ry="11" style="stroke:#000000;stroke-width:1.0;"/><ellipse cx="320.75" cy="1004.1982" fill="#FFFFFF" rx="6" ry="6" style="stroke:#000000;stroke-width:1.0;"/><line style="stroke:#000000;stroke-width:1.0;" x1="320.75" x2="320.75" y1="96.5957" y2="132.0681"/><polygon fill="#000000" points="316.75,122.0681,320.75,132.0681,324.75,122.0681,320.75,126.0681" style="stroke:#000000;stroke-width:1.0;"/><line style="stroke:#000000;stroke-width:1.0;" x1="320.7