text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="121.6714" x="222.0132" y="221.6572">empieza con https:// y es</text><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="185.3027" x="222.0132" y="234.3062">un dominio de board de Greenhouse?</text><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="7.9438" x="419.3159" y="221.6572">si</text><rect fill="#FFFFFF" height="33.7988" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1;" width="227.4805" x="200.9243" y="397.3013"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="207.4805" x="210.9243" y="418.5571">cortar todo lo que venga despues del #</text><rect fill="#FFFFFF" height="33.7988" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1;" width="208.7598" x="210.2847" y="451.1001"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="188.7598" x="220.2847" y="472.356">separar el camino de la query (el ?)</text><rect fill="#FFFFFF" height="33.7988" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1;" width="238.1035" x="195.6128" y="504.8989"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="218.1035" x="205.6128" y="526.1548">quedarse con el primer tramo del camino</text><polygon fill="#FFFFFF" points="257.5645,558.6978,371.7646,558.6978,383.7646,570.6978,371.7646,582.6978,257.5645,582.6978,245.5645,570.6978,257.5645,558.6978" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="114.2002" x="257.5645" y="574.6912">ese tramo es "embed"?</text><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="7.9438" x="237.6206" y="568.3667">si</text><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="12.2354" x="383.7646" y="568.3667">no</text><path d="M218.4297,592.6978 L218.4297,623.5952 L198.4297,627.5952 L218.4297,631.5952 L218.4297,662.4927 A0,0 0 0 0 218.4297,662.4927 L441.7549,662.4927 A0,0 0 0 0 441.7549,662.4927 L441.7549,602.6978 L431.7549,592.6978 L218.4297,592.6978 A0,0 0 0 0 218.4297,592.6978" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M431.7549,592.6978 L431.7549,602.6978 L441.7549,602.6978 L431.7549,592.6978" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="183.5234" x="224.4297" y="609.8916">Es el board metido como iframe</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="180.6733" x="224.4297" y="624.8403">dentro de la pagina de carreras</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="195.8506" x="224.4297" y="639.7891">de la empresa. Son un monton de</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="202.3252" x="224.4297" y="654.7378">capturas y apuntan al mismo lugar.</text><rect fill="#FFFFFF" height="33.7988" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1;" width="192.4297" x="6" y="610.6958"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="172.4297" x="16" y="631.9517">el slug esta en el parametro for=</text><rect fill="#FFFFFF" height="33.7988" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1;" width="130.7188" x="461.7549" y="592.6978"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="110.7188" x="471.7549" y="613.9536">ese tramo ES el slug</text><polygon fill="#FFFFFF" points="314.6646,668.4927,326.6646,680.4927,314.6646,692.4927,302.6646,680.4927,314.6646,668.4927" style="stroke:#000000;stroke-width:1;"/><path d="M365.0083,759.6084 L365.0083,797.9802 L345.0083,801.9802 L365.0083,805.9802 L365.0083,844.3521 A0,0 0 0 0 365.0083,844.3521 L627.3525,844.3521 A0,0 0 0 0 627.3525,844.3521 L627.3525,769.6084 L617.3525,759.6084 L365.0083,759.6084 A0,0 0 0 0 365.0083,759.6084" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M617.3525,759.6084 L617.3525,769.6084 L627.3525,769.6084 L617.3525,759.6084" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="183.5425" x="371.0083" y="776.8022">Este filtro, el solito, hace todo el</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="241.3442" x="371.0083" y="791.751">trabajo sucio sin listas negras: descarta lo</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="211.0024" x="371.0083" y="806.6997">vacio (el dominio pelado) y cualquier</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="195.1079" x="371.0083" y="821.6484">cosa con punto, como robots.txt o</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="221.8569" x="371.0083" y="836.5972">favicon.ico. Un slug nunca lleva punto.</text><rect fill="#FFFFFF" height="33.7988" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1;" width="60.6875" x="284.3208" y="785.0808"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="40.6875" x="294.3208" y="806.3367">sin slug</text><ellipse cx="314.6646" cy="875.3521" fill="none" rx="11" ry="11" style="stroke:#000000;stroke-width:1;"/><ellipse cx="314.6646" cy="875.3521" fill="#FFFFFF" rx="6" ry="6" style="stroke:#000000;stroke-width:1;"/><polygon fill="#FFFFFF" points="236.3862,712.4927,392.9429,712.4927,404.9429,725.1416,392.9429,737.7905,236.3862,737.7905,224.3862,725.1416,236.3862,712.4927" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" fon